<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
        --bg-hover: var(--figma-color-bg-hover, #ebebeb);
        --text: var(--figma-color-text, #1a1a1a);
        --text-secondary: var(--figma-color-text-secondary, #7a7a7a);
        --border: var(--figma-color-border, #e6e6e6);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --accent-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d4380d);
        --warning: var(--figma-color-text-warning, #a56a00);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px; color: var(--text); background: var(--bg);
        -webkit-user-select: none; user-select: none;
      }
      body { display: flex; flex-direction: column; }
      header { padding: 12px 16px 8px; }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
      .sub { color: var(--text-secondary); font-size: 11px; }
      main { flex: 1; overflow-y: auto; padding: 4px 16px 12px; }
      .targets { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
      label.row {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px;
        background: var(--bg-secondary); border: 1px solid var(--border);
        border-radius: 6px; cursor: pointer;
      }
      label.row:hover { background: var(--bg-hover); }
      label.row .name { font-weight: 500; }
      label.row .file { color: var(--text-secondary); font-family: ui-monospace, monospace; margin-left: auto; }
      input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
      .actions { display: flex; gap: 8px; margin: 8px 0 4px; }
      button {
        font: inherit; border: 1px solid var(--border); background: var(--bg-secondary);
        color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 500;
      }
      button:hover { background: var(--bg-hover); }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
      button.primary:disabled { opacity: 0.5; cursor: default; }
      button.small { padding: 4px 8px; font-size: 11px; }
      .msg { font-size: 11px; margin: 6px 0; white-space: pre-wrap; }
      .msg.error { color: var(--danger); }
      .msg.warn { color: var(--warning); }
      .results { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
      details {
        border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg-secondary);
      }
      summary {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
        font-family: ui-monospace, monospace; font-weight: 500;
      }
      summary .copy { margin-left: auto; }
      pre {
        margin: 0; padding: 10px; background: var(--bg); border-top: 1px solid var(--border);
        overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; line-height: 1.5; white-space: pre; user-select: text; max-height: 60vh;
      }
      footer { padding: 8px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
      .grow { flex: 1; }
      .resize {
        position: fixed; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
        background: linear-gradient(135deg, transparent 50%, var(--text-secondary) 50%, var(--text-secondary) 60%, transparent 60%, transparent 75%, var(--text-secondary) 75%, var(--text-secondary) 85%, transparent 85%);
        opacity: 0.6;
      }
      .hint { color: var(--text-secondary); font-size: 11px; margin-top: 8px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>
      <h1>Salty CSS Exporter</h1>
      <div class="sub">Export Figma variables &amp; text styles to Salty <code>.css.ts</code> files.</div>
    </header>
    <main>
      <div class="targets">
        <label class="row"><input type="checkbox" id="t-variables" checked /><span class="name">Variables</span><span class="file">variables.css.ts</span></label>
        <label class="row"><input type="checkbox" id="t-themes" checked /><span class="name">Themes</span><span class="file">themes.css.ts</span></label>
        <label class="row"><input type="checkbox" id="t-templates" checked /><span class="name">Text styles</span><span class="file">templates.css.ts</span></label>
        <label class="row"><input type="checkbox" id="t-fonts" checked /><span class="name">Fonts</span><span class="file">fonts.css</span></label>
      </div>
      <div class="actions">
        <button class="primary grow" id="export">Generate</button>
      </div>
      <div id="messages"></div>
      <div class="results" id="results"></div>
      <div class="hint" id="hint">
        Reads local variables and text styles from this file. Dev Mode: select a node to get a
        <code>styled()</code> / <code>className</code> snippet in the Inspect panel.
      </div>
    </main>
    <footer>
      <button class="grow" id="download" disabled>Download .zip</button>
      <button id="close">Close</button>
    </footer>
    <div class="resize" id="resize"></div>
  </body>
</html>
